<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Southern Rock Bands - Register</title>
    <style>
        body {
            font-family: 'Rock Salt', cursive, sans-serif;
            background: url('https://i.imgur.com/5zR0d7X.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            padding-top: 80px;
        }
        h1 {
            font-size: 60px;
            margin-bottom: 20px;
            text-shadow: 3px 3px #000;
        }
        form {
            background-color: rgba(0,0,0,0.7);
            display: inline-block;
            padding: 40px;
            border-radius: 15px;
        }
        input {
            padding: 12px;
            margin: 10px 0;
            width: 280px;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            background-color: #d35400;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        a {
            color: #f1c40f;
            text-decoration: none;
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Southern Rock Bands</h1>
    <h2>Register</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Create Account</button>
    </form>
    <a href="{{ url_for('login') }}">Already have an account? Login</a>
</body>
</html>
