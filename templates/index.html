<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Southern Rock Bands - Message Board</title>
    <style>
        body {
            font-family: 'Arial Black', sans-serif;
            background: url('https://i.imgur.com/6Z6VRDq.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            padding: 40px;
        }
        h1 {
            font-size: 60px;
            text-align: center;
            text-shadow: 3px 3px #000;
        }
        form {
            background-color: rgba(0,0,0,0.7);
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 500px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            background-color: #d35400;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .message {
            background-color: rgba(0,0,0,0.6);
            padding: 15px;
            margin: 10px auto;
            border-radius: 10px;
            max-width: 500px;
        }
        .message h3 {
            margin: 0;
            font-size: 18px;
        }
        .message p {
            font-size: 16px;
            margin: 5px 0 0 0;
        }
        .logout {
            text-align: center;
            margin-bottom: 20px;
        }
        .logout a {
            color: #f1c40f;
            text-decoration: none;
            font-weight: bold;
        }
        .logout a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Southern Rock Bands Message Board</h1>
    <div class="logout">
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
    <form method="POST" action="{{ url_for('post_message') }}">
        <input type="text" name="band_name" placeholder="Band Name" required>
        <textarea name="message" placeholder="Your message..." rows="4" required></textarea>
        <input type="hidden" name="username" value="{{ session.get('user_id') }}">
        <button type="submit">Post Message</button>
    </form>

    {% for msg in messages %}
    <div class="message">
        <h3>{{ msg.username }} - {{ msg.band_name }}</h3>
        <p>{{ msg.message }}</p>
        <small>{{ msg.timestamp }}</small>
    </div>
    {% endfor %}
</body>
</html>
